<!doctype html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05080E" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Set the theme before first paint to avoid a flash. Saved choice wins, else the OS setting.
      (function () {
        // The public site is always dark (brand design). Only the admin panel follows the saved / OS theme.
        var theme = "dark";
        if (/\/admin(\/|$)/.test(location.pathname)) {
          try { theme = localStorage.getItem("preferred-theme"); } catch (e) {}
          if (theme !== "light" && theme !== "dark") {
            theme = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          }
        }
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === "light" ? "#F6F5F2" : "#05080E";
      })();
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Пране на автомобилен интериор и възстановяване на фарове</title>
    <meta
      name="description"
      content="Професионално пране на автомобилен интериор и възстановяване на фарове. Изпратете запитване онлайн или по Viber."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
