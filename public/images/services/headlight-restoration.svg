<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="bg" cx="0.85" cy="0.1" r="1">
      <stop offset="0" stop-color="#29241a"/>
      <stop offset="0.5" stop-color="#151518"/>
      <stop offset="1" stop-color="#0f0f12"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26262c"/>
      <stop offset="1" stop-color="#121215"/>
    </linearGradient>
    <radialGradient id="proj" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#f6f1e6"/>
      <stop offset="0.3" stop-color="#8f8a80"/>
      <stop offset="1" stop-color="#1c1c21"/>
    </radialGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d8b775" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#d8b775" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#d8b775" stop-opacity="0"/>
    </linearGradient>
    <filter id="haze" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.62  0 0 0 0 0.55  0 0 0 0 0.36  0 0 0 0.9 0"/>
    </filter>
    <clipPath id="lens">
      <path d="M160 170 C260 120 560 110 660 150 C690 162 690 200 665 225 C600 290 300 320 200 300 C140 288 120 200 160 170 Z"/>
    </clipPath>
    <clipPath id="left"><rect x="0" y="0" width="400" height="450"/></clipPath>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- body panels around the lamp -->
  <path d="M0 120 C200 70 600 60 800 100 V60 C600 20 200 30 0 80 Z" fill="url(#panel)" stroke="#3a3a41"/>
  <path d="M0 330 C220 360 600 340 800 280 V450 H0 Z" fill="url(#panel)" stroke="#3a3a41"/>
  <path d="M60 380 C260 400 560 385 740 330" fill="none" stroke="#2c2c33" stroke-width="3"/>

  <!-- lens housing -->
  <path d="M160 170 C260 120 560 110 660 150 C690 162 690 200 665 225 C600 290 300 320 200 300 C140 288 120 200 160 170 Z" fill="#0d0d10" stroke="#55555e" stroke-width="3"/>

  <g clip-path="url(#lens)">
    <!-- internals (crisp) -->
    <path d="M190 172 C300 140 520 132 640 160" fill="none" stroke="#fdf6e4" stroke-width="5" stroke-linecap="round"/>
    <path d="M190 172 C300 140 520 132 640 160" fill="none" stroke="#d8b775" stroke-opacity="0.45" stroke-width="14" stroke-linecap="round"/>
    <circle cx="520" cy="220" r="52" fill="#141418" stroke="#4a4a52" stroke-width="2"/>
    <circle cx="520" cy="220" r="34" fill="url(#proj)"/>
    <circle cx="520" cy="220" r="44" fill="none" stroke="#2f2f36" stroke-width="2"/>
    <circle cx="320" cy="228" r="46" fill="#141418" stroke="#4a4a52" stroke-width="2"/>
    <circle cx="320" cy="228" r="28" fill="url(#proj)"/>
    <path d="M210 270 C330 280 480 270 600 240" fill="none" stroke="#2a2a30" stroke-width="2"/>
    <!-- glass reflection -->
    <path d="M440 135 L470 135 L380 300 L350 300 Z" fill="#fff" opacity="0.06"/>

    <!-- oxidised half: before polishing -->
    <g clip-path="url(#left)">
      <rect x="0" y="0" width="400" height="450" fill="#5a4e34" opacity="0.55"/>
      <rect x="0" y="0" width="400" height="450" filter="url(#haze)" opacity="0.75"/>
    </g>

    <!-- polishing edge -->
    <rect x="380" y="100" width="40" height="230" fill="url(#glow)" opacity="0.35"/>
    <path d="M400 100 V330" stroke="#d8b775" stroke-width="2"/>
  </g>

  <!-- polishing pad -->
  <g transform="translate(400 300)">
    <circle r="34" fill="#1a1a1e" stroke="#c9a45c" stroke-width="2"/>
    <circle r="22" fill="none" stroke="#c9a45c" stroke-opacity="0.5" stroke-dasharray="4 5"/>
    <rect x="-8" y="30" width="16" height="70" rx="6" fill="#26262c" stroke="#45454d"/>
  </g>
</svg>
