<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <radialGradient id="sky" cx="0.82" cy="0.08" r="0.9">
      <stop offset="0" stop-color="#2b2619"/>
      <stop offset="0.45" stop-color="#121215"/>
      <stop offset="1" stop-color="#0b0b0d"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26262c"/>
      <stop offset="0.45" stop-color="#18181c"/>
      <stop offset="1" stop-color="#0d0d10"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b0d"/>
      <stop offset="0.55" stop-color="#16161b"/>
      <stop offset="0.6" stop-color="#2a2a31"/>
      <stop offset="0.66" stop-color="#121216"/>
      <stop offset="1" stop-color="#0b0b0d"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9a45c" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#c9a45c" stop-opacity="0.55"/>
      <stop offset="0.9" stop-color="#d8b775" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#d8b775" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6e0"/>
      <stop offset="0.25" stop-color="#d8b775" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#c9a45c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>
  <rect x="980" y="-200" width="260" height="1400" fill="url(#sweep)" transform="rotate(20 1110 500)"/>

  <!-- floor: studio grid fading out -->
  <g stroke="#2a2a30" stroke-width="1">
    <path d="M0 800 H1600"/>
    <path d="M0 832 H1600" opacity="0.7"/>
    <path d="M0 872 H1600" opacity="0.5"/>
    <path d="M0 925 H1600" opacity="0.3"/>
  </g>
  <ellipse cx="1090" cy="806" rx="560" ry="34" fill="url(#shadow)"/>

  <!-- body -->
  <path d="M640 735 L632 680 C632 650 650 628 690 620 L840 600 C900 540 960 505 1040 500 L1200 500 C1260 502 1300 520 1350 580 L1470 615 C1515 625 1535 650 1538 690 L1536 735 L1452 738 A72 72 0 0 0 1308 738 L860 738 A72 72 0 0 0 716 738 Z"
        fill="url(#body)" stroke="#45454d" stroke-width="2" stroke-linejoin="round"/>

  <!-- greenhouse -->
  <path d="M880 598 C930 548 975 522 1040 518 L1195 518 C1245 520 1280 538 1318 585 Z" fill="url(#glass)" stroke="#3a3a41" stroke-width="2"/>
  <path d="M1110 518 L1104 598" stroke="#2c2c33" stroke-width="7"/>

  <!-- shoulder highlight -->
  <path d="M655 646 C900 632 1200 628 1505 638" fill="none" stroke="url(#edge)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M845 600 L1350 584" fill="none" stroke="#c9a45c" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- doors & details -->
  <g fill="none" stroke="#33333a" stroke-width="2">
    <path d="M1106 602 L1100 734"/>
    <path d="M880 604 C870 650 868 700 872 734"/>
    <path d="M1318 588 C1324 640 1322 700 1312 734"/>
    <path d="M700 705 H1520" stroke="#25252b"/>
  </g>
  <rect x="1010" y="654" width="40" height="6" rx="3" fill="#3a3a42"/>
  <rect x="1225" y="652" width="40" height="6" rx="3" fill="#3a3a42"/>
  <path d="M1300 600 L1330 597 L1326 614 L1302 612 Z" fill="#1b1b20" stroke="#3a3a41"/>

  <!-- lights -->
  <circle cx="1512" cy="648" r="120" fill="url(#lamp)" opacity="0.55"/>
  <path d="M1478 636 C1500 636 1520 640 1530 652 L1528 664 C1510 660 1490 656 1476 650 Z" fill="#f3e3bd"/>
  <path d="M636 650 L668 646 L670 662 L638 666 Z" fill="#7a2f2a" opacity="0.8"/>

  <!-- wheels -->
  <g>
    <circle cx="788" cy="740" r="60" fill="#09090b" stroke="#2f2f36" stroke-width="3"/>
    <circle cx="788" cy="740" r="38" fill="#141418" stroke="#55555e" stroke-width="2"/>
    <g stroke="#3f3f47" stroke-width="5" stroke-linecap="round">
      <path d="M788 706 V774"/><path d="M754 740 H822"/><path d="M764 716 L812 764"/><path d="M812 716 L764 764"/>
    </g>
    <circle cx="788" cy="740" r="9" fill="#c9a45c" opacity="0.8"/>
  </g>
  <g>
    <circle cx="1380" cy="740" r="60" fill="#09090b" stroke="#2f2f36" stroke-width="3"/>
    <circle cx="1380" cy="740" r="38" fill="#141418" stroke="#55555e" stroke-width="2"/>
    <g stroke="#3f3f47" stroke-width="5" stroke-linecap="round">
      <path d="M1380 706 V774"/><path d="M1346 740 H1414"/><path d="M1356 716 L1404 764"/><path d="M1404 716 L1356 764"/>
    </g>
    <circle cx="1380" cy="740" r="9" fill="#c9a45c" opacity="0.8"/>
  </g>

  <!-- floor reflection -->
  <g opacity="0.12" transform="translate(0 1600) scale(1 -1)">
    <path d="M640 735 L632 680 C632 650 650 628 690 620 L840 600 C900 540 960 505 1040 500 L1200 500 C1260 502 1300 520 1350 580 L1470 615 C1515 625 1535 650 1538 690 L1536 735 Z" fill="#2a2a30"/>
  </g>
  <rect x="0" y="800" width="1600" height="200" fill="#0b0b0d" opacity="0.55"/>
</svg>
